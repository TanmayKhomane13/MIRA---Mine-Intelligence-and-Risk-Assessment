{% extends "base.html" %}

{% block title %}Register - MIRA{% endblock %}

{% block content %}

{% include 'components/flash.html' %}

<div class="login-page">

    <div class="login-card register-card">

        <!-- Brand -->
        <div class="login-brand">
            <h1>MIRA</h1>
        </div>

        <!-- Heading -->
        <div class="login-heading">
            <h2>Create Account</h2>
            <p>
                Register - MIRA
            </p>
        </div>

        <!-- Registration Form -->
        <form method="POST" action="/register">

            <!-- Full Name -->
            <div class="login-field">
                <label for="name">
                    Full Name
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    autofocus
                >
            </div>

            <!-- Password -->
            <div class="login-field">
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="login-field">
                <label for="confirmation">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="confirmation"
                    name="confirmation"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <!-- Register -->
            <button type="submit" class="login-submit">
                Create Account
                <span>→</span>
            </button>
        </form>
        <!-- Login -->
        <div class="register-link">
            <p>
                Already have an account?
                <a href="/login">
                    Login here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
