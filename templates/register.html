<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - MIRA</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm p-8 border border-gray-200 rounded-2xl shadow-sm">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-black tracking-tight">
                MIRA
            </h1>
            <p class="text-sm text-gray-500 mt-1">
                Create your administration account
            </p>
        </div>
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 px-3 py-2 rounded-lg text-xs
                        {% if category == 'danger' %}
                            bg-red-50 text-red-700 border border-red-200
                        {% else %}
                            bg-gray-50 text-gray-700 border border-gray-200
                        {% endif %}
                    ">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <!-- Registration Form -->
        <form
            action="{{ url_for('register') }}"
            method="POST"
            class="space-y-4"
        >
            <!-- Name -->
            <div>
                <label
                    for="name"
                    class="block text-xs font-semibold uppercase text-gray-600 mb-1"
                >
                    Full Name
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name"
                    placeholder="Enter full name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                           focus:outline-none focus:border-black"
                >
            </div>
            <!-- Role -->
            <div>
                <label
                    for="role"
                    class="block text-xs font-semibold uppercase text-gray-600 mb-1"
                >
                    Role
                </label>
                <select
                    id="role"
                    name="role"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                           bg-white focus:outline-none focus:border-black"
                >
                    <option value="" disabled selected>
                        Select role
                    </option>
                    <option value="inspector">
                        Inspector
                    </option>
                    <option value="admin">
                        Administrator
                    </option>
                </select>
            </div>
            <!-- Regional Office -->
            <div>

                <label
                    for="regional_office"
                    class="block text-xs font-semibold uppercase text-gray-600 mb-1"
                >
                    Regional Office
                </label>
                <input
                    type="text"
                    id="regional_office"
                    name="regional_office"
                    placeholder="Enter regional office"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                           focus:outline-none focus:border-black"
                >
            </div>
            <!-- Password -->
            <div>
                <label
                    for="password"
                    class="block text-xs font-semibold uppercase text-gray-600 mb-1"
                >
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                           focus:outline-none focus:border-black"
                >
            </div>
            <!-- Confirm Password -->
            <div>
                <label
                    for="confirm_password"
                    class="block text-xs font-semibold uppercase text-gray-600 mb-1"
                >
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Confirm password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                           focus:outline-none focus:border-black"
                >
                <p
                    id="password-message"
                    class="text-xs mt-1"
                ></p>
            </div>
            <!-- Authorization -->
            <div class="flex items-start gap-2">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                    class="mt-0.5 accent-black"
                >
                <label
                    for="terms"
                    class="text-xs text-gray-500 leading-4"
                >
                    I confirm that I am an authorized user of this system.
                </label>
            </div>
            <!-- Submit -->
            <button
                type="submit"
                id="register-button"
                class="w-full py-2.5 bg-black text-white text-sm font-semibold
                       rounded-lg hover:bg-zinc-800 transition"
            >
                Create Account
            </button>
        </form>
        <!-- Login Link -->
        <div class="text-center mt-6 pt-5 border-t border-gray-100">
            <p class="text-xs text-gray-500">
                Already have an account?
                <a
                    href="{{ url_for('login') }}"
                    class="text-black font-semibold hover:underline"
                >
                    Sign In
                </a>
            </p>
        </div>
    </div>
    <!-- Password Validation -->
    <script>
        const password =
            document.getElementById("password");
        const confirmPassword =
            document.getElementById("confirm_password");
        const passwordMessage =
            document.getElementById("password-message");
        const registerButton =
            document.getElementById("register-button");

        function validatePasswords() {
            if (!confirmPassword.value) {
                passwordMessage.textContent = "";
                registerButton.disabled = false;
                return;
            }
            if (password.value !== confirmPassword.value) {
                passwordMessage.textContent =
                    "Passwords do not match.";
                passwordMessage.className =
                    "text-xs mt-1 text-red-600";
                registerButton.disabled = true;
            } else {
                passwordMessage.textContent =
                    "Passwords match.";
                passwordMessage.className =
                    "text-xs mt-1 text-gray-500";
                registerButton.disabled = false;
            }
        }

        password.addEventListener(
            "input",
            validatePasswords
        );
        confirmPassword.addEventListener(
            "input",
            validatePasswords
        );
    </script>
</body>
</html>
