<div class="bg-white border border-brand-border rounded-xl p-5 shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">{{title if title else "stat"}}</p>
    <p class="mt-2 text-3xl font-bold tracking-tight text-brand-black">{{ value }}</p>
    {% if change %}
    <p class="mt-1 text-xs text-gray-600">{{ change }}</p>
    {% endif %}
</div>
