<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login - MineGuard AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center h-screen">
    <div class="w-full max-w-sm p-8 border border-gray-200 rounded-2xl shadow-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-black tracking-tight">MIRA </h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to your administration panel</p>
        </div>
        <form action="{{ url_for('dashboard') }}" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
                <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-black" placeholder="e.g Ram">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
                <input type="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-black" placeholder="Enter passwords">
            </div>
            <button type="submit" class="w-full py-2.5 bg-black text-white text-sm font-semibold rounded-lg hover:bg-zinc-800 transition">Sign In</button>
        </form>
    </div>
</body>
</html>
