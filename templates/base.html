<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MIRA{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jomhuria&family=Josefin+Slab:ital,wght@0,100..700;1,100..700&family=Orbit&display=swap" rel="stylesheet">
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { black: '#09090b', dark: '#18181b', light: '#f4f4f5', border: '#e4e4e7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-white text-brand-black antialiased font-sans flex h-screen overflow-hidden">

    {% include 'components/sidebar.html' %}

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        {% include 'components/navbar.html' %}
        
        <main class="flex-1 overflow-y-auto bg-white p-6 lg:p-8">
            {% block content %} 
            
            {% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
